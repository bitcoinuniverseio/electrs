name: Universe native source preflight only

on:
  workflow_dispatch:
  push:
    branches: [codex/bounded-script-utxo-pages]
    paths:
      - .github/workflows/universe-native-preflight.yml
      - scripts/universe/native-preflight.py
      - scripts/universe/native-preflight.test.py

permissions:
  contents: read

concurrency:
  group: universe-electrs-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'bitcoinuniverseio/electrs' && github.ref == 'refs/heads/codex/bounded-script-utxo-pages'
    runs-on: [self-hosted, universe-runners-1]
    timeout-minutes: 5
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Inspect existing tools and isolated build prerequisites only
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          /usr/bin/python3 scripts/universe/native-preflight.py
