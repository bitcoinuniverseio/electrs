name: Universe isolated helper ABI metadata only

on:
  workflow_dispatch:
  push:
    branches: [codex/bounded-script-utxo-pages]
    paths:
      - .github/workflows/universe-native-preflight.yml
      - scripts/universe/native-preflight.py
      - scripts/universe/native-preflight.test.py
      - scripts/universe/native-tool-requirements.json
      - scripts/universe/sandbox-proof.py
      - scripts/universe/sandbox-proof-child.py
      - scripts/universe/sandbox-proof.test.py
      - scripts/universe/sandbox-diagnostic.py
      - scripts/universe/sandbox-diagnostic.test.py
      - scripts/universe/alternative-isolation-metadata.py
      - scripts/universe/confinement-proof.c
      - scripts/universe/confinement-proof.py
      - scripts/universe/confinement-build-child.py
      - scripts/universe/confinement-proof.test.py
      - scripts/universe/locked-source-inventory.py
      - scripts/universe/locked-source-inventory.test.py
      - scripts/universe/locked-cache-readonly.py
      - scripts/universe/locked-cache-readonly.test.py
      - scripts/universe/storage-enforcement-metadata.py
      - scripts/universe/storage-enforcement-metadata.test.py

permissions:
  contents: read

concurrency:
  group: universe-electrs-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'bitcoinuniverseio/electrs' && github.ref == 'refs/heads/codex/bounded-script-utxo-pages'
    runs-on: [self-hosted, universe-runners-1]
    timeout-minutes: 5
    steps:
      - name: Checkout exact dispatched source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Observe exact existing host library ABI without helper execution
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          /usr/bin/python3.12 -B -I -S scripts/universe/helper-runtime-metadata.py --observe-owned-runtime
